<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تبلت — لیست محصولات</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fz.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="board" style="width: 1788px; height: 1360px; padding: 40px; display: flex; gap: 40px; align-items: flex-start">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 16px">
  <div class="blbl"><i class="{{th.tag}}">{{th.label}}</i><b>تبلت ۸۳۴</b><span>۳ ستون · فیلتر در پنل کشویی</span></div>
  <div class="{{th.cls}} phone" style="width: 834px; height: 1194px; border-radius: 32px">
    <header class="hdr" style="height: 72px; padding: 0 16px; gap: 12px">
      <a class="logo" href="#" style="padding: 0"><span class="mk"></span><span style="display: flex; flex-direction: column; gap: 3px"><b>FRitZ</b></span></a>
      <div class="field" style="flex: 1"><dc-import name="Icon" i="search" s="20" hint-size="20px,20px"></dc-import><input placeholder="نام محصول یا کد مدل" aria-label="جست‌وجو"></div>
      <button class="ib" aria-label="{{th.themeLabel}}"><dc-import name="Icon" i="{{th.themeIcon}}" s="22" hint-size="22px,22px"></dc-import></button>
      <button class="ib" aria-label="لیست استعلام، ۲ قلم"><dc-import name="Icon" i="inquiry" s="22" hint-size="22px,22px"></dc-import><span class="cnt">۲</span></button>
    </header>
    <div style="padding: 20px 24px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div><nav aria-label="مسیر" class="t-c mut3">کاتالوگ / تاچ پنل</nav><h1 class="t-h1">تاچ پنل <span class="t-s mut3" style="font-weight: 600">۴۲ محصول</span></h1></div>
      <div style="display: flex; gap: 8px; align-items: center">
        <button class="btn btn-s btn-sm"><dc-import name="Icon" i="filter" s="18" hint-size="18px,18px"></dc-import>فیلتر<span class="cnt" style="position: static">۱</span></button>
        <button class="btn btn-s btn-sm"><dc-import name="Icon" i="sort" s="18" hint-size="18px,18px"></dc-import>پیشنهادی</button>
      </div>
    </div>
    <div class="chips" style="padding: 14px 24px 0">
      <span class="chip on rm"><span class="lat">KNX</span><button class="x" aria-label="حذف فیلتر KNX"><dc-import name="Icon" i="x" s="14" sw="2" hint-size="14px,14px"></dc-import></button></span>
      <span class="chip">لینوکس</span><span class="chip">اندروید</span><span class="chip">۷ اینچ</span><span class="chip">۸۶×۸۶</span>
    </div>
    <div class="scroll">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 16px 24px 100px">
        <sc-for list="{{products}}" as="p" hint-placeholder-count="6">
          <article class="card pc">
            <label class="cmp"><input type="checkbox" class="cbx" checked="{{p.cmp}}">مقایسه</label>
            <a class="pc-open" href="#"><div class="ph"><dc-import name="ProductArt" kind="{{p.kind}}" s="150" hint-size="150px,150px"></dc-import></div>
            <div class="pc-b"><span class="brand">{{p.brand}}</span><h3 class="pc-n">{{p.name}}</h3><span class="code">{{p.code}}</span><span class="pbs"><sc-for list="{{p.pl}}" as="x" hint-placeholder-count="1"><span class="pb">{{x}}</span></sc-for></span></div></a>
            <div class="pc-f"><button class="pc-add"><dc-import name="Icon" i="plus" s="16" sw="2" hint-size="16px,16px"></dc-import>افزودن به استعلام</button></div>
          </article>
        </sc-for>
      </div>
    </div>
    <div class="cbar" style="inset-inline: auto; left: 50%; transform: translateX(-50%); width: 480px; bottom: 20px">
      <span class="slot"><dc-import name="ProductArt" kind="panel" s="46" hint-size="46px,46px"></dc-import></span><span class="slot empty"></span><span class="slot empty"></span>
      <span class="t-c" style="font-weight: 700">۱ از ۳</span>
      <button class="btn btn-p btn-sm" disabled>حداقل ۲ محصول</button>
    </div>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"both","options":["both","light","dark"]},"$preview":{"width":1788,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme ?? 'both';
    const L = { cls: 'fz', label: 'روشن', tag: '', themeIcon: 'moon', themeLabel: 'تم تیره' };
    const D = { cls: 'fz dark', label: 'تیره', tag: 'dk', themeIcon: 'sun', themeLabel: 'تم روشن' };
    const P = (name, code, brand, pl, kind, cmp) => ({ name, code, brand, pl, kind, cmp: !!cmp });
    return {
      themes: t === 'light' ? [L] : t === 'dark' ? [D] : [L, D],
      products: [
        P('تاچ پنل ۵ اینچ Z50', 'ZVIZ50A', 'Zennio', ['KNX'], 'panel', true),
        P('تاچ پنل ۷ اینچ SmartTouch', 'ST-7', 'ABB', ['KNX'], 'panel7'),
        P('تاچ پنل ۴ اینچ Z41', 'ZVIZ41', 'Zennio', ['KNX'], 'panel'),
        P('تاچ پنل ۵ اینچ Z50 سفید', 'ZVIZ50W', 'Zennio', ['KNX'], 'panel'),
        P('تاچ پنل ۷ اینچ SmartTouch مشکی', 'ST-7B', 'ABB', ['KNX'], 'panel7'),
        P('تاچ پنل ۷ اینچ Z70', 'ZVIZ70', 'Zennio', ['KNX'], 'panel7')
      ]
    };
  }
}
</script>
</body>
</html>
