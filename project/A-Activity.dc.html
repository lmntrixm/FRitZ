<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>پنل FRitZ — گزارش فعالیت</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fz.css">
<link rel="stylesheet" href="./adm.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="board" style="display: flex; flex-direction: column; gap: 28px; padding: 28px 0 40px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 12px">
  <div class="blbl" style="padding: 0 28px"><i class="{{th.tag}}">{{th.label}}</i><b>گزارش فعالیت</b><span>خط زمانی قابل فیلتر با جزئیات تغییر</span></div>
  <div class="{{th.cls}} adm">
    <aside class="side" aria-label="منوی اصلی">
      <a class="logo" href="#"><span class="mk"></span><span style="display: flex; flex-direction: column; gap: 3px"><b>FRitZ</b><small>پنل مدیریت</small></span></a>
      <nav style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="11">
          <sc-if value="{{n.g}}" hint-placeholder-val="{{false}}"><span class="ng">{{n.g}}</span></sc-if>
          <sc-if value="{{n.k}}" hint-placeholder-val="{{true}}"><a class="{{n.cls}}" href="#" aria-current="{{n.cur}}"><span class="nvi"><dc-import name="Icon" i="{{n.i}}" s="18" hint-size="18px,18px"></dc-import></span>{{n.l}}<sc-if value="{{n.n}}" hint-placeholder-val="{{false}}"><span class="nb">{{n.n}}</span></sc-if><sc-if value="{{n.lock}}" hint-placeholder-val="{{false}}"><span class="nlock" aria-label="فقط مدیر کل"><dc-import name="Icon" i="lock" s="14" hint-size="14px,14px"></dc-import></span></sc-if></a></sc-if>
        </sc-for>
      </nav>
      <div class="me"><span class="av">سم</span><span style="display: flex; flex-direction: column; line-height: 1.5; min-width: 0"><b style="font-size: 13px">سارا محمدی</b><span class="t-c mut3">مدیر کل</span></span></div>
    </aside>
    <div class="main">
      <header class="top">
        <div class="field gsearch"><dc-import name="Icon" i="search" s="18" hint-size="18px,18px"></dc-import><input placeholder="جست‌وجوی نام یا کد محصول" aria-label="جست‌وجوی سراسری"><span class="kbd">Ctrl K</span></div>
        <div style="flex: 1"></div>
        <button class="ib" aria-label="{{th.themeLabel}}"><dc-import name="Icon" i="{{th.themeIcon}}" s="20" hint-size="20px,20px"></dc-import></button>
        <button class="ib" aria-label="اعلان‌ها"><dc-import name="Icon" i="bell" s="20" hint-size="20px,20px"></dc-import></button>
        <button class="btn btn-g btn-sm" style="padding: 0 8px"><span class="av sm">سم</span>سارا محمدی<dc-import name="Icon" i="chevDown" s="16" hint-size="16px,16px"></dc-import></button>
        <button class="ib" aria-label="خروج"><dc-import name="Icon" i="logout" s="20" hint-size="20px,20px"></dc-import></button>
      </header>
      <div class="content">
        <div class="phead">
          <div><nav class="crumb" aria-label="مسیر"><span>پنل</span><dc-import name="Icon" i="chevNext" s="12" hint-size="12px,12px"></dc-import><span>گزارش فعالیت</span></nav><h1 class="ptitle">گزارش فعالیت</h1></div>
          <div class="acts"><button class="btn btn-s btn-sm"><dc-import name="Icon" i="table" s="18" hint-size="18px,18px"></dc-import>خروجی اکسل</button></div>
        </div>
        <div class="panel">
          <div class="toolbar">
            <button class="selbtn">کاربر: همه<dc-import name="Icon" i="chevDown" s="14" hint-size="14px,14px"></dc-import></button>
            <button class="selbtn on">عمل: ویرایش، حذف، به‌روزرسانی<dc-import name="Icon" i="x" s="14" hint-size="14px,14px"></dc-import></button>
            <button class="selbtn">موجودیت: همه<dc-import name="Icon" i="chevDown" s="14" hint-size="14px,14px"></dc-import></button>
            <button class="selbtn"><dc-import name="Icon" i="calendar" s="16" hint-size="16px,16px"></dc-import>۷ روز اخیر</button>
            <div style="flex: 1"></div>
            <span class="t-c mut">۶۸ رویداد</span>
          </div>
          <div style="padding: 4px 18px 12px">
            <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
              <p class="glabel" style="padding: 14px 0 4px">{{d.day}}</p>
              <div class="tl">
                <sc-for list="{{d.items}}" as="a" hint-placeholder-count="3">
                  <div class="tli" style="border-bottom: 1px solid var(--line)">
                    <span class="{{a.ic}}"><dc-import name="Icon" i="{{a.i}}" s="16" hint-size="16px,16px"></dc-import></span>
                    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
                      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span class="t-s"><b>{{a.who}}</b> {{a.what}}</span><span class="st draft" style="height: 20px">{{a.ent}}</span><span class="t-c mut3" style="margin-inline-start: auto">{{a.t}}</span>
                        <sc-if value="{{a.hasD}}" hint-placeholder-val="{{false}}"><button class="btn btn-g btn-sm" style="min-height: 32px; padding: 0 6px" aria-expanded="{{a.open}}">{{a.btn}}<dc-import name="Icon" i="{{a.chev}}" s="14" hint-size="14px,14px"></dc-import></button></sc-if></div>
                      <sc-if value="{{a.open}}" hint-placeholder-val="{{false}}">
                        <div class="panel" style="border-radius: 0"><table class="tbl" style="font-size: 12px"><thead><tr><th>فیلد</th><th>قبل</th><th></th><th>بعد</th></tr></thead><tbody>
                          <sc-for list="{{a.d}}" as="x" hint-placeholder-count="2"><tr><td style="font-weight: 700">{{x.f}}</td><td><span class="was">{{x.b}}</span></td><td style="color: var(--tx3)"><dc-import name="Icon" i="arrowNext" s="12" hint-size="12px,12px"></dc-import></td><td><span class="now">{{x.a}}</span></td></tr></sc-for>
                        </tbody></table></div>
                      </sc-if>
                    </div>
                  </div>
                </sc-for>
              </div>
            </sc-for>
          </div>
          <div style="padding: 12px 18px; border-top: 1px solid var(--line)"><button class="btn btn-s btn-sm">رویدادهای قدیمی‌تر</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"both","options":["both","light","dark"]},"$preview":{"width":1440,"height":2400}}'>
const NAVD = [
  { k: 'overview', l: 'نمای کلی', i: 'grid2' }, { k: 'products', l: 'محصولات', i: 'box' },
  { k: 'cats', l: 'دسته‌ها و فیلترها', i: 'folder' }, { k: 'brands', l: 'برندها و پروتکل‌ها', i: 'tag' },
  { k: 'media', l: 'رسانه', i: 'image' }, { k: 'inq', l: 'استعلام‌ها', i: 'chat', n: '۱۲' },
  { g: 'مدیریت' },
  { k: 'update', l: 'به‌روزرسانی', i: 'upload', lock: true }, { k: 'users', l: 'کاربران', i: 'users', lock: true },
  { k: 'log', l: 'گزارش فعالیت', i: 'activity' }, { k: 'settings', l: 'تنظیمات', i: 'settings', lock: true }
];
const navFor = (a) => NAVD.map((n) => (n.g ? { g: n.g, k: '' } : { ...n, g: '', n: n.n || '', lock: !!n.lock, cls: 'nv' + (n.k === a ? ' on' : ''), cur: n.k === a ? 'page' : 'false' }));
const themesFor = (t) => { const L = { cls: 'fz', label: 'روشن', tag: '', themeIcon: 'moon', themeLabel: 'تم تیره' }; const D = { cls: 'fz dark', label: 'تیره', tag: 'dk', themeIcon: 'sun', themeLabel: 'تم روشن' }; return t === 'light' ? [L] : t === 'dark' ? [D] : [L, D]; };
class Component extends DCLogic {
  renderVals() {
    const A = (ic, i, who, what, ent, t, d, open) => ({ ic: 'ic ' + ic, i, who, what, ent, t, d: d || [], hasD: !!(d && d.length), open: !!open, btn: open ? 'بستن جزئیات' : 'جزئیات', chev: open ? 'chevUp' : 'chevDown' });
    return {
      themes: themesFor(this.props.theme ?? 'both'), nav: navFor('log'),
      days: [
        { day: 'امروز، شنبه ۲۵ مهر', items: [
          A('mod', 'edit', 'سارا محمدی', '«تاچ پنل ۷ اینچ MixPad Matter» را ویرایش کرد', 'محصول', '۱۴:۲۰', [{ f: 'توضیحات', b: '۱۲۰ نویسه', a: '۲۸۴ نویسه' }, { f: 'محصولات مرتبط', b: '—', a: 'MixPad Mini' }], true),
          A('add', 'globe', 'رضا کریمی', '۲ محصول را منتشر کرد', 'محصول', '۱۱:۲۰', [{ f: 'وضعیت', b: 'پیش‌نویس', a: 'منتشرشده' }]),
          A('del', 'trash', 'رضا کریمی', '۳ فایل بدون استفاده را حذف کرد', 'رسانه', '۱۰:۰۵', [{ f: 'فایل‌ها', b: 'ot-p10_datasheet_v1.pdf، …', a: 'حذف' }])
        ] },
        { day: 'جمعه ۲۴ مهر', items: [
          A('mod', 'tag', 'سارا محمدی', 'پروتکل‌های IP و Wi-Fi را غیرفعال کرد', 'پروتکل', '۱۸:۱۰', [{ f: 'IP', b: 'فعال', a: 'غیرفعال' }, { f: 'Wi-Fi', b: 'فعال', a: 'غیرفعال' }]),
          A('add', 'plus', 'سارا محمدی', 'فیلتر «نصب روکار» را به «تاچ پنل» افزود', 'فیلتر', '۱۶:۳۲', [{ f: 'نوع', b: '—', a: 'بله / خیر' }]),
          A('', 'user', 'سارا محمدی', 'مهسا تقوی را با نقش ویرایشگر محتوا دعوت کرد', 'کاربر', '۰۹:۴۰')
        ] },
        { day: 'شنبه ۱۸ مهر', items: [
          A('up', 'upload', 'سارا محمدی', 'به‌روزرسانی fritz_update_1405-07-18 را اعمال کرد: ۴ جدید، ۲۱ ویرایش', 'به‌روزرسانی', '۱۰:۰۵', [{ f: 'پشتیبان', b: '—', a: 'BK-14050718-1005' }])
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
